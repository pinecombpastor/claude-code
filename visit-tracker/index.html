<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visit Tracker</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<h1>Visit Tracker</h1>
<form id="f">
  <input id="name" placeholder="Name" required>
  <input id="date" type="date" required>
  <input id="note" placeholder="Short note (keep it non-sensitive)">
  <button>Log visit</button>
</form>
<label>Flag after <input id="days" type="number" value="30" min="1"> days</label>
<ul id="list"></ul>
<script src="main.js" defer></script>
</body>
</html>
